name: Publish Foundry module

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify version and build
        run: |
          version=$(node -p 'require("./module.json").version')
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Expected a release tag matching module.json (v$version)."
            exit 1
          fi
          npm run check
          npm run pack
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/module.json dist/cosmere-rpg-mistborn-handbook-ru.zip \
            --verify-tag --latest --title "$GITHUB_REF_NAME" --generate-notes
